# /etc/nginx/sites-available/mallway  (ative com: ln -s ... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx)
# Depois: certbot --nginx -d mallway.omniasoftwares.com   (certificado gratuito)

server {
    listen 80;
    server_name mallway.omniasoftwares.com;

    access_log /var/log/nginx/mallway.access.log;   # coberto pelo logrotate padrão do Nginx (/var/log/nginx/*.log)
    error_log  /var/log/nginx/mallway.error.log;

    # Plantas enviadas pelo editor chegam a 10 MB
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---- Mapas publicados e plantas: servidos direto do disco, sem passar pelo Python ----
    # Versões e plantas têm o conteúdo no nome (imutáveis): cache de 1 ano.
    location ~ ^/p/[^/]+/(v[0-9]+\.json|floors/[0-9a-f]{16}\.webp)$ {
        root /var/lib/mallway/public;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # latest.json muda a cada publicação/rollback: sempre revalida (ETag torna isso barato).
    location /p/ {
        root /var/lib/mallway/public;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ---- API (FastAPI em 127.0.0.1:8000) ----
    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Sobrescreve (não acrescenta) para o cliente não forjar o IP usado no limite de tentativas de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- App (build do Vite) ----
    root /var/www/mallway/dist;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Service worker/manifest nunca em cache longo
    location = /manifest.json { add_header Cache-Control "no-cache"; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
}
